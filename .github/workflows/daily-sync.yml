name: Daily Jubelio sync
on:
  schedule:
    - cron: "7 21 * * *"   # 04:07 WIB every day (off the hour: GitHub drops/delays on-the-hour schedules)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-sync   # a second run waits for the first instead of racing it to push
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 reportlab==4.2.5
      - name: Pull Jubelio data
        env:
          JUBELIO_EMAIL: ${{ secrets.JUBELIO_EMAIL }}
          JUBELIO_PASSWORD: ${{ secrets.JUBELIO_PASSWORD }}
        run: python scripts/jubelio_sync.py
      - name: Reseller ready stock (newest Accurate snapshot in Drive + Jubelio stores)
        continue-on-error: true   # a Drive hiccup keeps yesterday's list and must not stop the data commit
        run: python scripts/ready_stock.py --drive
      - name: Covers and synopses for the reseller lists
        continue-on-error: true   # a lookup outage must not stop the data commit
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: python scripts/book_meta.py
      - name: Commit data
        run: |
          git config user.name "jubelio-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data cache
          git diff --cached --quiet || git commit -m "Jubelio data $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs   # code pushed while the sync ran; on a data clash this run's fresher files win
          git push
