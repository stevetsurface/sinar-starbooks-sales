name: Reseller ready stock
# Yoga's Accurate snapshot lands in Drive around 09:00 to 10:00; these runs pick it up. Same list the 04:00 sync builds,
# with that morning's Jubelio store stock. No new file yet = the newest one there is used.
on:
  schedule:
    - cron: "7 5 * * *"    # 12:07 WIB
    - cron: "7 8 * * *"    # 15:07 WIB
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-sync   # never races the main sync to push
  cancel-in-progress: false
jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - run: python scripts/ready_stock.py --drive
      - name: Commit if changed
        run: |
          git config user.name "jubelio-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ready_stock.csv
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Ready stock from Drive $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs
          git push
